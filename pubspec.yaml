name: senagat_mobile
description: "Senagat bank mobile app"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.6.6
  get_storage: ^2.1.1
  cached_network_image: ^3.4.1
  dio: ^5.2.0
  dio_cache_interceptor: ^3.3.1
  dio_cache_interceptor_hive_store: ^3.2.0
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  flutter_svg: ^2.0.14
  flutter_native_splash: ^2.4.2
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4
  google_fonts: ^6.2.1
  intl: 0.20.2
  flutter_screenutil: ^5.9.3
  build_runner: ^2.4.13
  overlay_support: ^2.1.0
  win32: ^5.8.0
  pin_code_fields: ^8.0.0
  archive: ^3.6.1
  pinenacl: ^0.6.0
  flutter_launcher_icons: ^0.14.4
  url_launcher: ^6.3.2
  persistent_bottom_nav_bar: ^6.1.2
  smooth_page_indicator: ^1.2.1
  mask_text_input_formatter: ^2.4.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  mobile_scanner: ^6.0.2
  dropdown_button2: ^2.3.9
  flutter_xlider: ^3.5.0
  flutter_masked_text2: ^0.9.0
  universal_image: ^1.0.11
  file_picker: ^8.0.0
  flutter_native_contact_picker: ^0.0.11
  yandex_mapkit: ^4.2.1
  mapbox_maps_flutter: ^2.12.0


  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  fl_chart: ^0.63.0
  flutter_staggered_animations: ^1.1.1
  flutter_switch: ^0.3.2
  roundcheckbox: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1
  build_runner: ^2.3.3

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/

  fonts:
    - family: Kinetika
      fonts:
        - asset: assets/fonts/Kinetika-Bold.ttf
          weight: 400

    - family: Gilroy
      fonts:
        - asset: assets/fonts/Gilroy-Regular.otf
        - asset: assets/fonts/Gilroy-Bold.otf
          weight: 400
    - family: Xolonium
      fonts:
        - asset: assets/fonts/Xolonium-Regular.otf
        - asset: assets/fonts/Xolonium-Bold.otf
          weight: 400


flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app.png"
  min_sdk_android: 21
  remove_alpha_ios: true